name = "forma-workspace"
main = "backend/src/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

[[d1_databases]]
binding = "DB"
database_name = "forma-db"
# Replace with the ID from wrangler d1 create forma-db before deploying.
database_id = "00000000-0000-0000-0000-000000000000"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionManager"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionManager"]

# Use `npm run dev:ai` after authenticating Wrangler to enable live inference.
# The default local workspace keeps structural translation available offline.
[env.ai]
name = "forma-workspace-ai"

[env.ai.vars]
AGENT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

[env.ai.ai]
binding = "AI"
remote = true

[[env.ai.d1_databases]]
binding = "DB"
database_name = "forma-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[env.ai.durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionManager"
