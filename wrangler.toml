name = "codemeld"
main = "backend/src/index.ts"
compatibility_date = "2024-12-18"

# AI Binding for Cloudflare Workers AI
[ai]
binding = "AI"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "codemeld-db"
database_id = "ddb9cf83-4f5d-42cb-b094-5c2175911e09"

# Durable Objects
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionManager"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionManager"]

# Trigger for Workflows - cron format
[triggers]
crons = ["0 */6 * * *"]
