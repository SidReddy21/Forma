name = "codemeld"
main = "backend/src/index.ts"
compatibility_date = "2024-12-18"

# AI Binding for Cloudflare Workers AI
[ai]
binding = "AI"

script_name = "codemeld"

# Durable Objects
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionManager"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionManager"]

# Trigger for Workflows - cron format
[triggers]
crons = ["0 */6 * * *"]
